[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-finqa"
version = "0.1.0"
description = "Financial report ingestion and question-answering pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Benson Zhang" }]
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "psutil>=5.9,<8",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "sqlglot>=27,<29",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=9,<27"]
ocr = [
    "onnxruntime>=1.20,<2",
    "pypdfium2>=4,<6",
    "rapidocr>=3.9,<4",
]
dev = [
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
smart-finqa = "smart_finqa.cli:main"
smart-finqa-llm-extract = "smart_finqa.llm_extraction_cli:main"
smart-finqa-web = "smart_finqa.api:main"
smart-finqa-worker = "smart_finqa.runtime:worker_main"

[tool.setuptools.packages.find]
include = ["smart_finqa*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["smart_finqa"]

[tool.coverage.report]
show_missing = true
skip_covered = true
